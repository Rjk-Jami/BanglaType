name: Avro phonetic tests

on:
  push:
    branches: [crossplatform]
  pull_request:
    branches: [crossplatform]

jobs:
  avro-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Avro regression tests
        run: npm run test:avro
